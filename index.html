<!DOCTYPE html>
<html lang="mg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <title>MÏMĮ BØSS MUSIC</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --gold: #d8b45a;
      --red: #b51220;
      --black: #080808;
      --card: #151515;
    }

    body {
      margin: 0;
      background: var(--black);
      color: #fff;
      font-family: Arial, sans-serif;
    }

    header {
      text-align: center;
      padding: 38px 18px 30px;
      background:
        radial-gradient(ellipse at top, #4a1115 0%, #160b0b 45%, #080808 80%);
      border-bottom: 1px solid var(--gold);
    }

    .crown {
      font-size: 35px;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0;
      font-size: clamp(27px, 7vw, 38px);
      letter-spacing: 2px;
      color: var(--gold);
      text-shadow: 0 0 18px #9b6d2344;
    }

    .subtitle {
      margin: 12px 0 0;
      color: #ddd;
      font-size: 12px;
      letter-spacing: 3px;
    }

    .badge {
      display: inline-block;
      margin-top: 18px;
      padding: 7px 14px;
      border: 1px solid var(--gold);
      border-radius: 30px;
      color: var(--gold);
      font-size: 11px;
      letter-spacing: 1px;
    }

    main {
      max-width: 650px;
      margin: auto;
      padding: 22px 16px;
    }
